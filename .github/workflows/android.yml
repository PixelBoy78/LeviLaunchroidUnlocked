name: Android CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave empty for automatic version based on git tag, e.g. v1.6.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Download Discord Social SDK (Optional)
        env:
          GH_TOKEN: ${{ secrets.DISCORD_SDK_TOKEN }}
          DISCORD_SDK_REPOSITORY: ${{ vars.DISCORD_SDK_REPOSITORY }}
        run: |
          if [ -n "${GH_TOKEN:-}" ] && [ -n "${DISCORD_SDK_REPOSITORY:-}" ]; then
            echo "Downloading Discord Partner SDK from $DISCORD_SDK_REPOSITORY..."
            mkdir -p app/libs
            gh release download 'discord-sdk-1.10.19337' \
              --repo "$DISCORD_SDK_REPOSITORY" \
              --pattern 'discord_partner_sdk.aar' \
              --dir app/libs \
              --clobber || echo "Discord SDK download failed, building without Discord integration"
          else
            echo "Discord SDK secrets not configured; building without Discord integration"
          fi

      - name: Prepare google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Download Android testkey
        run: |
          wget -q -O testkey.pk8 "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8"
          wget -q -O testkey.x509.pem "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem"

      - name: Install apksigner
        run: sudo apt-get install -y apksigner

      - name: Sign APK with testkey
        run: |
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION_NAME=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null | sed 's/^v//' || echo "")
          if [ -z "$VERSION_NAME" ] || ! echo "$VERSION_NAME" | grep -qE '^[0-9]'; then
            VERSION_NAME="1.6.1"
          fi
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          APK_OUT="LeviLauncher-${RELEASE_TAG}-release.apk"
          apksigner sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "$APK_IN"
          echo "APK_OUT=$APK_OUT" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error

      - name: Upload R8 Mappings
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-r8-mappings-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "LeviLauncher Unlocked ${{ env.RELEASE_TAG }}"
          files: ${{ env.APK_OUT }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
